name: Linux Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Test & vet
        run: |
          go test ./...
          go vet ./...

      - name: Build linux binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-0.1.0}"
          LDFLAGS="-s -w -X github.com/Gelmezon/grok-switch/internal/cli.Version=${VERSION}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags="${LDFLAGS}" \
            -o dist/grok-switch-linux-amd64 ./cmd/grok-switch
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -trimpath -ldflags="${LDFLAGS}" \
            -o dist/grok-switch-linux-arm64 ./cmd/grok-switch
          cd dist && sha256sum grok-switch-linux-* > SHA256SUMS

      - name: Attest release binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: 'dist/grok-switch-linux-*'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
